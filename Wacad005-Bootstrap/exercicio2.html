<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineList Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

   
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">CineList Admin</a>

            <div class="d-flex gap-3">
                <a class="nav-link text-white" href="#" data-bs-toggle="offcanvas" data-bs-target="#menuLateral">
                    Menu
                </a>
                <a class="nav-link text-white" href="#">Sair</a>
            </div>
        </div>
    </nav>

   
    <div class="container mt-5 pt-5">
        <h2 class="mb-4">Gerenciar Catálogo</h2>

        <div class="text-end mb-3">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalFilme">
                Adicionar Filme
            </button>
        </div>

        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Gênero</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>01</td>
                    <td>O Senhor dos Anéis</td>
                    <td>Fantasia</td>
                    <td><span class="badge bg-success">Assistido</span></td>
                    <td>
                        <button class="btn btn-outline-primary btn-sm">Editar</button>
                        <button class="btn btn-outline-danger btn-sm">Excluir</button>
                    </td>
                </tr>

                <tr>
                    <td>02</td>
                    <td>Interestelar</td>
                    <td>Ficção Científica</td>
                    <td><span class="badge bg-warning text-dark">Pendente</span></td>
                    <td>
                        <button class="btn btn-outline-primary btn-sm">Editar</button>
                        <button class="btn btn-outline-danger btn-sm">Excluir</button>
                    </td>
                </tr>

                <tr>
                    <td>03</td>
                    <td>O Poderoso Chefão</td>
                    <td>Drama</td>
                    <td><span class="badge bg-success">Assistido</span></td>
                    <td>
                        <button class="btn btn-outline-primary btn-sm">Editar</button>
                        <button class="btn btn-outline-danger btn-sm">Excluir</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

   
    <div class="modal fade" id="modalFilme" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Cadastrar Filme</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Nome do Filme</label>
                            <input type="text" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Categoria</label>
                            <select class="form-select">
                                <option>Selecione</option>
                                <option>Ação</option>
                                <option>Drama</option>
                                <option>Fantasia</option>
                                <option>Comédia</option>
                                <option>Ficção Científica</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Resumo</label>
                            <textarea class="form-control" rows="4"></textarea>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary">Salvar</button>
                </div>

            </div>
        </div>
    </div>

   
    <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="menuLateral">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">CineList</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>

        <div class="offcanvas-body p-0">
            <div class="list-group list-group-flush">
                <a href="#" class="list-group-item list-group-item-action bg-dark text-white">
                    Dashboard
                </a>

                <a href="#" class="list-group-item list-group-item-action active">
                    Catálogo de Filmes
                </a>

                <a href="#" class="list-group-item list-group-item-action bg-dark text-white">
                    Gerenciar Usuários
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
