<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
</head>

<body>

    <div id="app-tarefas">

        <h3>Minhas Tarefas</h3>

        <input type="text" id="input-nova-tarefa" placeholder="Digite uma tarefa...">

        <button id="btn-adicionar">Adicionar Tarefa</button>

        <ul id="lista-tarefas">
            <li>Revisar código da aula passada</li>
        </ul>

    </div>

    <script>

        let input = document.getElementById("input-nova-tarefa");

        let botao = document.getElementById("btn-adicionar");

        let lista = document.getElementById("lista-tarefas");

        botao.addEventListener("click", function () {

            let textoTarefa = input.value;

            if (textoTarefa !== "") {

                let novaTarefa = document.createElement("li");

                novaTarefa.innerText = textoTarefa;

                lista.appendChild(novaTarefa);

                input.value = "";

            }

        });

    </script>

</body>

</html>
